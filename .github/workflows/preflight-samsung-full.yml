name: Preflight Samsung v2 narration and 26 scenes

on:
  push:
    branches:
      - feat/samsung-nokia-full-standard
      - feat/samsung-full-env-weather
    paths:
      - '.github/workflows/preflight-samsung-full.yml'
      - 'stories/003-samsung/**'
      - 'scripts/preflight-samsung-full.ts'
      - 'scripts/prepare_voiceover.py'
      - 'scripts/browser.ts'
      - 'examples/catalog.ts'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: samsung-full-preflight
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Samsung source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
          run_install: false

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck Samsung v2 scene and timing code
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Install Chromium
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Set up Python for Vietnamese voiceover
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install VieNeu-TTS
        run: python -m pip install --upgrade pip vieneu

      - name: Generate real WAV clips and sequential timeline
        run: |
          python scripts/prepare_voiceover.py \
            --manifest stories/003-samsung/voiceover.json \
            --clips-dir out/samsung-full-voice-clips \
            --timing-module stories/003-samsung/voiceoverTiming.ts

      - name: Validate narration gaps and clip inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('out/samsung-full-voice-clips')
          timing=json.load(open(root/'timing.json'))
          lines=timing['lines']
          assert len(lines)==29, f'expected 29 lines, got {len(lines)}'
          scene_indices=timing['scene_line_indices']
          scene_durations=timing['scene_durations_sec']
          scene_starts=timing['scene_starts_sec']
          assert len(scene_indices)==len(scene_durations)==len(scene_starts)==26
          assert abs(timing['duration_sec']-450)<0.02, f"timeline is {timing['duration_sec']:.2f}s, expected 450s"
          for i in range(1,len(lines)):
              gap=lines[i]['start_sec']-lines[i-1]['end_sec']
              assert gap>=-0.001, f'narration overlap at line {i+1}: {gap:.3f}s'
              if i in scene_indices:
                  scene=scene_indices.index(i)
                  assert abs(lines[i]['start_sec']-scene_starts[scene])<0.02, f'scene {scene+1} start drifted'
              else:
                  assert gap<=0.5, f'unintended silence inside scene at line {i+1}: {gap:.3f}s'
          segments=[seg for line in lines for seg in line['segments']]
          assert len(segments)>=29, f'expected at least 29 sentence clips, got {len(segments)}'
          assert all((root/seg['clip']).is_file() for seg in segments), 'missing WAV clip'
          assert all(seg['duration_sec']>0.2 for seg in segments), 'suspiciously short WAV clip'
          print(f"PASS: {len(lines)} lines / {len(segments)} WAV segments; 26 scene boundaries; runtime {timing['duration_sec']:.2f}s; max intentional scene hold {timing['max_inter_scene_gap_sec']:.2f}s")
          PY

      - name: Preflight all 26 scene entrances and voice cues without full render
        run: pnpm exec node scripts/preflight-samsung-full.ts samsung-full

      - name: Upload Samsung Full preflight report
        uses: actions/upload-artifact@v4
        with:
          name: samsung-full-preflight
          path: out/samsung-full-voice-clips/timing.json
          if-no-files-found: error
          retention-days: 7
