name: Create reusable YouTube thumbnail

on:
  workflow_dispatch:
    inputs:
      title:
        description: Main headline (Vietnamese supported; use \n for a deliberate line break)
        required: true
        type: string
        default: "NOKIA ĐÃ THUA NHƯ THẾ NÀO?"
      kicker:
        description: Small category label in the fixed top-left position
        required: true
        type: string
        default: "CÂU CHUYỆN CÔNG NGHỆ"
      subtitle:
        description: Optional supporting line in the lower-left safe zone
        required: false
        type: string
        default: ""
      image_url:
        description: Optional direct HTTPS image URL for the topic-specific right-side collage (recommended for precise subjects)
        required: false
        type: string
        default: ""
      output_name:
        description: PNG artifact name (without extension)
        required: true
        type: string
        default: "nokia-thumbnail"

permissions:
  contents: read

concurrency:
  group: papermotion-thumbnail-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  thumbnail:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core python3-pil
      - name: Install project dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and system dependencies
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Render legacy thumbnail with PaperMotion paper underlay
        env:
          THUMBNAIL_TITLE: ${{ inputs.title }}
          THUMBNAIL_KICKER: ${{ inputs.kicker }}
          THUMBNAIL_SUBTITLE: ${{ inputs.subtitle }}
          THUMBNAIL_IMAGE_URL: ${{ inputs.image_url }}
          THUMBNAIL_OUTPUT_NAME: ${{ inputs.output_name }}
        shell: bash
        run: |
          node scripts/create-thumbnail.ts --output out/paper-underlay.png
          python3 scripts/create_thumbnail.py \
            --title "$THUMBNAIL_TITLE" \
            --kicker "$THUMBNAIL_KICKER" \
            --subtitle "$THUMBNAIL_SUBTITLE" \
            --image-url "$THUMBNAIL_IMAGE_URL" \
            --paper-underlay out/paper-underlay.png \
            --output "out/$THUMBNAIL_OUTPUT_NAME.png"
      - name: Upload thumbnail
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}
          path: out/${{ inputs.output_name }}.png
          if-no-files-found: error
          retention-days: 14
