name: Build Samsung pilot with Nokia Full style

on:
  push:
    branches:
      - feat/samsung-nokia-full-standard
    paths:
      - '.github/workflows/test-samsung-pilot.yml'
      - 'stories/003-samsung/**'
      - 'stories/shared/environment/**'
      - 'scripts/preflight-samsung.ts'
      - 'scripts/browser.ts'
      - 'examples/catalog.ts'
      - 'examples/rooftops/Cat.ts'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: samsung-nokia-full-pilot
  cancel-in-progress: false

jobs:
  render-samsung-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
          run_install: false

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Set up Python for Vietnamese voiceover
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install free VieNeu-TTS
        run: python -m pip install --upgrade pip vieneu

      - name: Generate sentence clips and measure exact narration timeline
        run: |
          python scripts/prepare_voiceover.py \
            --manifest stories/003-samsung/voiceover.json \
            --clips-dir out/samsung-voice-clips \
            --timing-module stories/003-samsung/voiceoverTiming.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Verify measured dialogue never overlaps
        run: |
          python - <<'PY'
          import json
          timing=json.load(open('out/samsung-voice-clips/timing.json'))
          lines=timing['lines']
          assert len(lines)==11, f'expected 11 voice lines, got {len(lines)}'
          for previous,current in zip(lines,lines[1:]):
              assert current['start_sec'] >= previous['end_sec'], (previous,current)
          for line in lines:
              for previous,current in zip(line['segments'],line['segments'][1:]):
                  assert current['start_sec'] >= previous['end_sec'], (previous,current)
          print(f"PASS: {len(lines)} voice lines, {sum(len(x['segments']) for x in lines)} sentence clips; no overlap; timeline {timing['duration_sec']:.2f}s")
          PY

      - name: Preflight every scene, paper reveal and narration cue
        run: pnpm exec node scripts/preflight-samsung.ts samsung-pilot

      - name: Render 10-scene Samsung pilot in Nokia Full style
        run: pnpm render samsung-pilot --draft --jobs 1

      - name: Mix Adam and My Duyen voiceover
        run: |
          python scripts/generate_voiceover.py \
            --manifest stories/003-samsung/voiceover.json \
            --clips-dir out/samsung-voice-clips \
            --input out/samsung-pilot.mp4 \
            --output out/samsung-pilot-10-scenes.mp4

      - name: Verify duration, resolution, frame rate and audio
        shell: bash
        run: |
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,width,height,r_frame_rate -of json out/samsung-pilot-10-scenes.mp4 > out/samsung-pilot-probe.json
          python - <<'PY'
          import json
          p=json.load(open('out/samsung-pilot-probe.json'))
          duration=float(p['format']['duration'])
          streams=p['streams']
          video=next(s for s in streams if s.get('codec_type')=='video')
          audio=any(s.get('codec_type')=='audio' for s in streams)
          timing=json.load(open('out/samsung-voice-clips/timing.json'))
          expected=float(timing['duration_sec'])
          assert duration >= expected - 0.1, f'video is shorter than measured narration: {duration} < {expected}'
          assert (video.get('width'),video.get('height'))==(960,540), video
          assert video.get('r_frame_rate')=='30/1', video
          assert audio, 'missing audio stream'
          print(f'PASS: {duration:.2f}s (measured story {expected:.2f}s), 960x540 draft, 30fps, audio present')
          PY

      - name: Upload Samsung pilot review files (no intermediate draft)
        uses: actions/upload-artifact@v4
        with:
          name: samsung-10-scenes-nokia-full-review
          path: |
            out/samsung-pilot-10-scenes.mp4
            out/samsung-voice-clips/timing.json
            out/samsung-pilot.wav
            out/samsung-pilot_audio.png
            out/samsung-pilot-probe.json
          if-no-files-found: error
          retention-days: 7
