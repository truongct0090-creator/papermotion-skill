name: Test Samsung 10-scene pilot

on:
  push:
    paths:
      - 'stories/003-samsung/**'
      - 'examples/catalog.ts'
      - '.github/workflows/test-samsung-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: samsung-pilot-test-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  render-samsung-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
          run_install: false

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Render first 10 scenes as draft
        run: pnpm render samsung-pilot --draft --jobs 1

      - name: Set up Python for Vietnamese voiceover
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install free VieNeu-TTS
        run: python -m pip install --upgrade pip vieneu

      - name: Generate Adam and My Duyen voiceover
        run: |
          python scripts/generate_voiceover.py \
            --manifest stories/003-samsung/voiceover.json \
            --input out/samsung-pilot_draft.mp4 \
            --output out/samsung-pilot-10-scenes.mp4 \
            --timing-output out/samsung-pilot-voice-timing.json

      - name: Verify dialogue does not overlap
        run: |
          python - <<'PY'
          import json
          p=json.load(open('out/samsung-pilot-voice-timing.json'))
          lines=p['lines']
          for previous,current in zip(lines,lines[1:]):
              assert current['start_sec'] >= previous['end_sec'], (previous,current)
          print(f"PASS: {len(lines)} voice lines, no overlap; last line ends at {p['voice_end_sec']:.2f}s")
          PY

      - name: Verify duration, resolution, frame rate and audio
        shell: bash
        run: |
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,width,height,r_frame_rate -of json out/samsung-pilot-10-scenes.mp4 > out/samsung-pilot-probe.json
          python - <<'PY'
          import json
          p=json.load(open('out/samsung-pilot-probe.json'))
          duration=float(p['format']['duration'])
          streams=p['streams']
          video=next(s for s in streams if s.get('codec_type')=='video')
          audio=any(s.get('codec_type')=='audio' for s in streams)
          assert 119.5 <= duration <= 120.5, f'unexpected duration: {duration}'
          assert (video.get('width'),video.get('height'))==(960,540), video
          assert video.get('r_frame_rate')=='30/1', video
          assert audio, 'missing audio stream'
          print(f'PASS: {duration:.2f}s, 960x540, 30fps, audio present')
          PY

      - name: Upload Samsung pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: samsung-10-scenes-2min-draft
          path: |
            out/samsung-pilot-10-scenes.mp4
            out/samsung-pilot_draft.mp4
            out/samsung-pilot.wav
            out/samsung-pilot-voice-timing.json
            out/samsung-pilot_audio.png
            out/samsung-pilot-probe.json
          if-no-files-found: error
          retention-days: 7
