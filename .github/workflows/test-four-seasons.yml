name: Test four seasons film

on:
  push:
    branches: [main]
    paths:
      - 'stories/001-four-seasons/**'
      - 'stories/shared/environment/**'
      - 'examples/rooftops/Cat.ts'
      - 'examples/catalog.ts'
      - '.github/workflows/test-four-seasons.yml'
  workflow_dispatch:
    inputs:
      quality:
        description: Render quality
        required: true
        type: choice
        default: draft
        options:
          - draft
          - full

permissions:
  contents: read

concurrency:
  group: papermotion-four-seasons-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  render-four-seasons:
    name: Render 20-second four seasons test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
          run_install: false
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Typecheck and test
        run: |
          pnpm typecheck
          pnpm test
      - name: Render four seasons (draft)
        if: inputs.quality == 'draft'
        run: pnpm render seasons20 --draft --jobs 1
      - name: Render four seasons (full)
        if: inputs.quality == 'full'
        run: pnpm render seasons20 --jobs 1
      - name: Verify 20-second video and mandatory audio
        shell: bash
        run: |
          VIDEO="out/seasons20.mp4"
          if [ "${{ inputs.quality }}" = "draft" ]; then VIDEO="out/seasons20_draft.mp4"; fi
          test -s "$VIDEO"
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type -of json "$VIDEO" > out/seasons20_probe.json
          node -e "const p=require('./out/seasons20_probe.json'); const d=Number(p.format.duration); if (Math.abs(d-20)>0.15) throw new Error('Expected 20s video, got '+d); if (!p.streams.some(s=>s.codec_type==='audio')) throw new Error('Audio stream missing'); console.log('Verified '+d.toFixed(2)+'s video with audio.');"
          test -s out/seasons20.wav
          test -s out/seasons20_audio.png
      - name: Upload test film and sound report
        uses: actions/upload-artifact@v4
        with:
          name: four-seasons-20s-${{ inputs.quality }}
          path: |
            out/seasons20*.mp4
            out/seasons20.wav
            out/seasons20_cues.json
            out/seasons20_audio.png
            out/seasons20_probe.json
          if-no-files-found: error
          retention-days: 7
