name: Test Nokia 10-scene pilot

on:
  push:
    paths:
      - 'stories/002-nokia/**'
      - 'examples/catalog.ts'
      - '.github/workflows/test-nokia-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nokia-pilot-test-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  render-nokia-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
          run_install: false

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Render 10-scene draft
        run: pnpm render nokia-pilot --draft --jobs 1

      - name: Set up Python for Vietnamese voiceover
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install free VieNeu-TTS
        run: python -m pip install --upgrade pip vieneu

      - name: Generate Adam and My Duyen voiceover
        run: |
          python scripts/generate_voiceover.py \
            --manifest stories/002-nokia/voiceover.json \
            --input out/nokia-pilot_draft.mp4 \
            --output out/nokia-pilot-10-scenes.mp4

      - name: Verify duration, resolution, frame rate and audio
        shell: bash
        run: |
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,width,height,r_frame_rate -of json out/nokia-pilot-10-scenes.mp4 > out/nokia-pilot-probe.json
          python - <<'PY'
          import json
          p=json.load(open('out/nokia-pilot-probe.json'))
          duration=float(p['format']['duration'])
          streams=p['streams']
          video=next(s for s in streams if s.get('codec_type')=='video')
          audio=any(s.get('codec_type')=='audio' for s in streams)
          assert 119.5 <= duration <= 120.5, f'unexpected duration: {duration}'
          assert (video.get('width'),video.get('height'))==(960,540), video
          assert video.get('r_frame_rate')=='30/1', video
          assert audio, 'missing audio stream'
          print(f'PASS: {duration:.2f}s, 960x540, 30fps, audio present')
          PY

      - name: Upload Nokia pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: nokia-10-scenes-2min-draft
          path: |
            out/nokia-pilot-10-scenes.mp4
            out/nokia-pilot_draft.mp4
            out/nokia-pilot.wav
            out/nokia-pilot_audio.png
            out/nokia-pilot-probe.json
          if-no-files-found: error
          retention-days: 7
