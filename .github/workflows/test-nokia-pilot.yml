name: Test Nokia 10-scene pilot

on:
  push:
    paths:
      - 'stories/002-nokia/**'
      - 'stories/shared/environment/**'
      - 'examples/rooftops/Cat.ts'
      - 'scripts/generate_voiceover.py'
      - 'scripts/prepare_voiceover.py'
      - 'examples/catalog.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nokia-pilot-test-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  render-nokia-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
          run_install: false

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Set up Python for Vietnamese voiceover
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install free VieNeu-TTS
        run: python -m pip install --upgrade pip vieneu

      - name: Generate voice clips and measure exact narration timeline
        run: |
          python scripts/prepare_voiceover.py \
            --manifest stories/002-nokia/voiceover.json \
            --clips-dir out/nokia-voice-clips \
            --timing-module stories/002-nokia/voiceoverTiming.ts

      - name: Render final-resolution 10-scene pilot to measured voice timeline
        run: pnpm render nokia-pilot --jobs 1

      - name: Generate Adam and My Duyen voiceover
        run: |
          python scripts/generate_voiceover.py \
            --manifest stories/002-nokia/voiceover.json \
            --clips-dir out/nokia-voice-clips \
            --input out/nokia-pilot.mp4 \
            --output out/nokia-pilot-final.mp4

      - name: Verify duration, resolution, frame rate and audio
        shell: bash
        run: |
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,width,height,r_frame_rate -of json out/nokia-pilot-final.mp4 > out/nokia-pilot-probe.json
          python - <<'PY'
          import json
          p=json.load(open('out/nokia-pilot-probe.json'))
          duration=float(p['format']['duration'])
          streams=p['streams']
          video=next(s for s in streams if s.get('codec_type')=='video')
          audio=any(s.get('codec_type')=='audio' for s in streams)
          timing=json.load(open('out/nokia-voice-clips/timing.json'))
          expected=float(timing['duration_sec'])
          assert duration >= expected - 0.1, f'video is shorter than measured voiceover timeline: {duration} < {expected}'
          assert (video.get('width'),video.get('height'))==(1920,1080), video
          assert video.get('r_frame_rate')=='30/1', video
          assert audio, 'missing audio stream'
          print(f'PASS: {duration:.2f}s (measured story {expected:.2f}s), 1920x1080, 30fps, audio present')
          PY

      - name: Upload final Nokia pilot only
        uses: actions/upload-artifact@v4
        with:
          name: nokia-10-scenes-final
          path: |
            out/nokia-pilot-final.mp4
            out/nokia-pilot-probe.json
          if-no-files-found: error
          retention-days: 7
