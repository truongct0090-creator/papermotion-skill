name: Render PaperMotion video

on:
  workflow_dispatch:
    inputs:
      example:
        description: Demo scene to render
        required: true
        type: choice
        default: demo
        options:
          - demo
          - snow
          - sea
          - rooftops
          - light
          - embers
          - rain
          - kite
          - hands
          - nokia-pilot
      voiceover_manifest:
        description: Optional story voiceover JSON manifest path
        required: false
        type: string
      quality:
        description: Draft is faster; full is higher quality
        required: true
        type: choice
        default: draft
        options:
          - draft
          - full

permissions:
  contents: read

concurrency:
  group: papermotion-render-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
          run_install: false

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Render video
        shell: bash
        run: |
          if [ "${{ inputs.quality }}" = "draft" ]; then
            pnpm render "${{ inputs.example }}" --draft --jobs 1
          else
            pnpm render "${{ inputs.example }}" --jobs 1
          fi

      - name: Export full-quality video in 2K QHD
        if: inputs.quality == 'full'
        shell: bash
        run: |
          for file in out/*.mp4; do
            [ -f "$file" ] || continue
            temp="${file%.mp4}_2k.mp4"
            ffmpeg -v error -y -i "$file" -vf "scale=2560:1440:flags=lanczos" -c:v libx264 -crf 15 -preset slow -pix_fmt yuv420p -c:a copy -movflags +faststart "$temp"
            mv "$temp" "$file"
          done
      - name: Set up Python for optional Vietnamese voiceover
        if: inputs.voiceover_manifest != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install VieNeu-TTS (CPU, free and open-source)
        if: inputs.voiceover_manifest != ''
        run: python -m pip install --upgrade pip vieneu

      - name: Generate and mix Vietnamese voiceover
        if: inputs.voiceover_manifest != ''
        shell: bash
        run: |
          suffix=""
          if [ "${{ inputs.quality }}" = "draft" ]; then suffix="_draft"; fi
          input="out/${{ inputs.example }}${suffix}.mp4"
          output="out/${{ inputs.example }}${suffix}_voice.mp4"
          python scripts/generate_voiceover.py --manifest "${{ inputs.voiceover_manifest }}" --input "$input" --output "$output"
          mv "$output" "$input"

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: papermotion-${{ inputs.example }}-${{ inputs.quality }}
          path: |
            out/*.mp4
            out/*.wav
            out/*_audio.png
          if-no-files-found: error
          retention-days: 7
