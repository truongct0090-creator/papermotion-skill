name: Test VieNeu-TTS Vietnamese voices

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_voiceover.py'
      - 'docs/voiceover.md'
      - '.github/workflows/test-vieneu-voiceover.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vieneu-voice-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-vieneu-voices:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install VieNeu-TTS CPU SDK
        run: python -m pip install --upgrade pip vieneu
      - name: Generate one sample with each required Southern voice
        run: |
          python - <<'PY'
          from vieneu import Vieneu
          tts = Vieneu()
          samples = [
              ("Adam", "Xin chào các bạn, chúng ta cùng bắt đầu câu chuyện hôm nay.", "out-adam.wav"),
              ("Mỹ Duyên", "Bạn có biết chuyện gì đã xảy ra tiếp theo không?", "out-my-duyen.wav"),
          ]
          for name, text, path in samples:
              audio = tts.infer(text, voice=name)
              tts.save(audio, path)
              print(f"Generated {name}: {path}")
          PY
      - name: Verify both WAV files
        run: |
          test -s out-adam.wav
          test -s out-my-duyen.wav
          ffprobe -v error -show_entries stream=sample_rate,channels -of json out-adam.wav
          ffprobe -v error -show_entries stream=sample_rate,channels -of json out-my-duyen.wav
      - name: Upload voice samples
        uses: actions/upload-artifact@v4
        with:
          name: vieneu-adam-my-duyen-smoke-test
          path: |
            out-adam.wav
            out-my-duyen.wav
          retention-days: 7
