name: Build full Samsung 28-scene film

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch containing the Samsung Full implementation'
        required: true
        default: 'feat/samsung-nokia-full-standard'
        type: string

permissions:
  contents: read

concurrency:
  group: samsung-full-build
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Samsung source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test

  render-samsung-full:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out Samsung source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
          run_install: false

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Set up Python for Vietnamese voiceover
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install free VieNeu-TTS
        run: python -m pip install --upgrade pip vieneu

      - name: Generate trimmed voice clips and sequential measured timeline
        run: |
          python scripts/prepare_voiceover.py \
            --manifest stories/003-samsung/voiceover.json \
            --clips-dir out/samsung-full-voice-clips \
            --timing-module stories/003-samsung/voiceoverTiming.ts

      - name: Reject long pauses or overlapping dialogue
        run: |
          python - <<'PY'
          import json
          timing=json.load(open('out/samsung-full-voice-clips/timing.json'))
          lines=timing['lines']
          assert len(lines)==29, f'expected 29 voice lines, got {len(lines)}'
          gaps=[b['start_sec']-a['end_sec'] for a,b in zip(lines,lines[1:])]
          assert all(-0.001 <= g <= 0.5 for g in gaps), f'invalid inter-line gaps: {gaps}'
          segment_gaps=[]
          for line in lines:
              segment_gaps += [b['start_sec']-a['end_sec'] for a,b in zip(line['segments'],line['segments'][1:])]
          assert all(-0.001 <= g <= 0.5 for g in segment_gaps), f'invalid sentence gaps: {segment_gaps}'
          assert timing['duration_sec'] > lines[-1]['end_sec'], 'timeline lacks the final audio tail'
          print(f"PASS: {len(lines)} lines; max inter-line gap {max(gaps):.3f}s; max sentence gap {max(segment_gaps,default=0):.3f}s; duration {timing['duration_sec']:.2f}s")
          PY

      - name: Preflight all 28 scenes, transitions and voice cues
        run: pnpm exec node scripts/preflight-samsung-full.ts samsung-full

      - name: Render full-resolution 28-scene Samsung film
        run: pnpm render samsung-full --jobs 1

      - name: Mix Adam and My Duyen narration
        run: |
          python scripts/generate_voiceover.py \
            --manifest stories/003-samsung/voiceover.json \
            --clips-dir out/samsung-full-voice-clips \
            --input out/samsung-full.mp4 \
            --output out/samsung-full-final.mp4

      - name: Verify duration, Full HD resolution, frame rate and audio
        shell: bash
        run: |
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,width,height,r_frame_rate -of json out/samsung-full-final.mp4 > out/samsung-full-probe.json
          python - <<'PY'
          import json
          p=json.load(open('out/samsung-full-probe.json'))
          duration=float(p['format']['duration'])
          streams=p['streams']
          video=next(s for s in streams if s.get('codec_type')=='video')
          audio=any(s.get('codec_type')=='audio' for s in streams)
          timing=json.load(open('out/samsung-full-voice-clips/timing.json'))
          expected=float(timing['duration_sec'])
          assert duration >= expected - 0.1, f'video is shorter than measured narration: {duration} < {expected}'
          assert (video.get('width'),video.get('height'))==(1920,1080), video
          assert video.get('r_frame_rate')=='30/1', video
          assert audio, 'missing audio stream'
          print(f'PASS: {duration:.2f}s (measured story {expected:.2f}s), 1920x1080 Full HD, 30fps, audio present')
          PY

      - name: Upload Samsung Full film and verification reports
        uses: actions/upload-artifact@v4
        with:
          name: samsung-28-scenes-full
          path: |
            out/samsung-full-final.mp4
            out/samsung-full-probe.json
            out/samsung-full-voice-clips/timing.json
            out/samsung-full.wav
            out/samsung-full_audio.png
          if-no-files-found: error
          retention-days: 7
